include:
  - keycloak.yml
services:
  frontend:
    build: frontend/
    depends_on:
      - backend
    ports:
      - "80:80"
      # - "1234:1234"

  backend:
     build: backend/
     depends_on:
       - keycloak
     ports:
       - "5109:5109"
       - "7156:7156"
     environment:
       - "OpenIDConnectSettings__ClientSecret=${CLIENT_SECRET}"
       - "OpenIDConnectSettings__Authority=http://keycloak:8080/realms/vulntrack"
       - "OpenIDConnectSettings__Frontend=http://localhost"
