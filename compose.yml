include:
  - keycloak.yml
services:
  frontend:
    build: frontend/
    depends_on:
      - backend
    ports:
      - "1234:1234"
      - "2019:2019"

  backend:
    build: backend/
    depends_on:
      - keycloak
    ports:
      - "5109:5109"
      - "7156:7156"
    environment:
      - OpenIDConnectSettings__ClientSecret=${CLIENT_SECRET}
